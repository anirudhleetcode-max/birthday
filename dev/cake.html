<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0614">
  <title>Dev · Cake scene</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../assets/vendor/three/three.module.min.js",
        "three/addons/": "../assets/vendor/three/addons/"
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/scenes/cake.css">
  <script src="../assets/vendor/gsap/gsap.min.js"></script>
  <script src="../assets/vendor/gsap/CustomEase.min.js"></script>
  <script src="../assets/vendor/gsap/DrawSVGPlugin.min.js"></script>
  <script src="../assets/vendor/gsap/MotionPathPlugin.min.js"></script>
  <script src="../assets/vendor/gsap/SplitText.min.js"></script>
  <script src="../assets/vendor/gsap/Physics2DPlugin.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #05020a; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #stage > section { position: absolute; inset: 0; }
    .dev-bar { position: fixed; top: 8px; right: 8px; z-index: 99; display: flex; gap: 6px; }
    .dev-bar button { font: 12px/1 monospace; padding: 6px 8px; background: #222; color: #ddd; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <main id="stage"></main>
  <script type="module">
    window.__CAKE_DEV__ = true;
    // SwiftShader/headless frames can be slow; keep GSAP on wall-clock time while developing
    if (new URLSearchParams(location.search).has('nolag')) window.gsap.ticker.lagSmoothing(0);
    import { createMockCtx } from './mock-ctx.js';
    import scene from '../assets/js/scenes/cake.js';

    // content: data/settings.json + data/messages.json (?deftext=1 → the scene's built-in fallback copy).
    const qs = new URLSearchParams(location.search);
    const [settings, messages] = await Promise.all([
      fetch('../data/settings.json').then((r) => r.json()).catch(() => ({})),
      fetch('../data/messages.json').then((r) => r.json()).catch(() => ({})),
    ]);
    const site = { ...settings, her: settings.her || { name: 'Deepu' }, text: { ...messages } };
    if (qs.has('deftext')) delete site.text.cake;
    const stage = document.getElementById('stage');
    let mock = null, el = null;

    async function boot() {
      el = document.createElement('section');
      el.className = 'scene scene-cake';
      stage.appendChild(el);
      mock = createMockCtx({ site, root: el });
      window.__mock = mock;
      await scene.enter(mock.ctx, el);
      window.__entered = true;
    }
    async function stop() {
      mock.abort();
      await scene.exit();
      mock.destroyFx();
      el.remove();
      window.__entered = false;
    }
    window.__devStop = stop;
    window.__devBoot = boot;

    if (new URLSearchParams(location.search).has('devui')) {
      const bar = document.createElement('div'); bar.className = 'dev-bar';
      bar.innerHTML = '<button id="b-exit">exit()</button><button id="b-enter">enter()</button>';
      document.body.appendChild(bar);
      bar.querySelector('#b-exit').onclick = stop;
      bar.querySelector('#b-enter').onclick = boot;
    }
    boot();
  </script>
</body>
</html>
