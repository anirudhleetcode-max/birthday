<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0614">
  <title>Dev · Transitions</title>
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/scenes/shared.css">
  <link rel="stylesheet" href="../assets/css/scenes/transitions.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../assets/vendor/three/three.module.min.js",
        "three/addons/": "../assets/vendor/three/addons/"
      }
    }
  </script>
  <script src="../assets/vendor/gsap/gsap.min.js"></script>
  <script src="../assets/vendor/gsap/CustomEase.min.js"></script>
  <script src="../assets/vendor/gsap/DrawSVGPlugin.min.js"></script>
  <script src="../assets/vendor/gsap/MotionPathPlugin.min.js"></script>
  <script src="../assets/vendor/gsap/SplitText.min.js"></script>
  <script src="../assets/vendor/gsap/Physics2DPlugin.min.js"></script>
  <style>
    .dummy { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 10px; overflow: hidden; }
    .dummy h1 { margin: 0; font: 400 clamp(34px, 9vw, 72px)/1.05 'Cinzel Decorative', serif; color: #fff1d6; text-shadow: 0 2px 24px rgba(0, 0, 0, .4); }
    .dummy p { margin: 0; font: italic 400 clamp(18px, 4.6vw, 28px)/1.3 'Cormorant Garamond', serif; color: #fff4e0; opacity: .85; }
    .dummy .photo { width: min(46vw, 260px); aspect-ratio: 4 / 5; border-radius: 6px; background: center / cover no-repeat; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); margin-bottom: 10px; }
    .dummy-a { background: radial-gradient(120% 80% at 50% 0%, #ffe9cf 0%, #f7c9a6 45%, #d98f8a 80%, #8a4f7a 100%); }
    .dummy-a h1, .dummy-a p { color: #4a2346; text-shadow: none; }
    .dummy-b { background: radial-gradient(120% 90% at 50% 110%, #6b3fa0 0%, #3b1a57 35%, #160b26 75%, #0b0614 100%); }
    .dummy .dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #ffb347; box-shadow: 0 0 20px 6px rgba(255, 179, 71, .6); translate: -50% -50%; }
    .devbar { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 90; display: flex; flex-wrap: wrap; gap: 6px; }
    .devbar button, .devbar label { font: 12px/1 ui-monospace, monospace; padding: 7px 9px; background: rgba(20, 10, 34, .72); color: #f6e7c9; border: 1px solid rgba(244, 196, 99, .4); border-radius: 6px; cursor: pointer; }
    .devbar label { display: inline-flex; gap: 6px; align-items: center; }
    body.clean .devbar { display: none; }
    #log { position: fixed; left: 8px; bottom: 8px; z-index: 90; font: 11px/1.4 ui-monospace, monospace; color: #d9c8f5; opacity: .85; }
  </style>
</head>
<body>
  <main id="stage"></main>
  <canvas id="dust" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="grade" aria-hidden="true"></div>
  <div id="letterbox" aria-hidden="true"><i class="lb-top"></i><i class="lb-bot"></i></div>
  <div id="transition" aria-hidden="true"></div>
  <div class="devbar" id="bar"></div>
  <div id="log"></div>
  <script type="module">
    import { transition, TRANSITIONS } from '../assets/js/core/transitions.js';

    // ?type=ribbon  &handoff=1 (or handoff=x,y in px)  &auto=1  &reduced  &low  &clean  &photo  &to=hair
    const q = new URLSearchParams(location.search);
    const gsap = window.gsap;
    gsap.registerPlugin(CustomEase);
    CustomEase.create('film', '0.65,0,0.35,1');
    if (q.has('clean')) document.body.classList.add('clean');
    const device = {
      mobile: innerWidth < 900, lowPower: q.has('low'), reducedMotion: q.has('reduced'),
      tier: q.has('low') ? 'low' : innerWidth < 900 ? 'mid' : 'high', dpr: Math.min(devicePixelRatio || 1, 2),
    };
    const audio = { sfx: (n) => log(`sfx ${n}`) };
    const stage = document.getElementById('stage');
    const logEl = document.getElementById('log');
    const lines = [];
    function log(t) { lines.push(`${((performance.now() - (window.__t0 || 0)) / 1000).toFixed(2)}s ${t}`); logEl.textContent = lines.slice(-6).join('\n'); }
    let photo = null;
    if (q.has('photo')) {
      try {
        const d = await (await fetch('../data/photos.json')).json();
        const p = (d.photos || []).find((x) => x.src);
        if (p) photo = `../${p.src}`;
      } catch { /* ignore */ }
    }
    let flip = false;
    let hand = null;
    function makeScene(which) {
      const el = document.createElement('section');
      el.className = `scene dummy dummy-${which}`;
      el.innerHTML = `${photo ? `<div class="photo" style="background-image:url('${photo}')"></div>` : ''}<h1>Scene ${which.toUpperCase()}</h1><p>${which === 'a' ? 'a warm morning, somewhere' : 'and then the night came'}</p>`;
      return el;
    }
    stage.appendChild(makeScene('a'));
    function handoffInfo() {
      const h = q.get('handoff');
      if (!h) return null;
      const [x, y] = h.includes(',') ? h.split(',').map(Number) : [innerWidth * 0.26, innerHeight * 0.3];
      return { x, y, color: '#ffb347', kind: 'test', from: 'dev' };
    }
    async function play(type) {
      const h = handoffInfo();
      const cur = stage.firstElementChild;
      if (h && cur) {
        hand = document.createElement('i');
        hand.className = 'dot';
        hand.style.left = `${h.x}px`;
        hand.style.top = `${h.y}px`;
        cur.appendChild(hand);
      }
      flip = !flip;
      window.__t0 = performance.now();
      window.__done = false;
      log(`start ${type}`);
      await transition(type, async () => {
        log('swap');
        window.__swapAt = (performance.now() - window.__t0) / 1000;
        stage.replaceChildren(makeScene(flip ? 'b' : 'a'));
        if (q.has('throw')) throw new Error('test: swap throws');
      }, { handoff: h, to: q.get('to') || (flip ? 'hair' : 'tower'), device, audio, get letterbox() { return '0px'; } });
      window.__dur = (performance.now() - window.__t0) / 1000;
      const tr = document.getElementById('transition');
      window.__clean = tr.childElementCount === 0 && getComputedStyle(tr).opacity === '0';
      log(`done ${window.__dur.toFixed(2)}s (swap ${window.__swapAt.toFixed(2)}s) clean=${window.__clean}`);
      window.__done = true;
    }
    window.__play = play;
    const bar = document.getElementById('bar');
    for (const t of TRANSITIONS) {
      const b = document.createElement('button');
      b.textContent = t;
      b.addEventListener('click', () => play(t));
      bar.appendChild(b);
    }
    if (q.get('type') && q.has('auto')) setTimeout(() => play(q.get('type')), Number(q.get('delay') || 600));
  </script>
</body>
</html>
