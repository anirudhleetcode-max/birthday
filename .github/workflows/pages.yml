# Publishes the film to GitHub Pages from `main` (including every Publish from the admin).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Only the public site (dist/: film, admin, assets, data, photos, media) is deployed —
# not tests, scripts, docs or dev pages. The build fails if any reference is broken.
name: Publish the film

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and check the site
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
