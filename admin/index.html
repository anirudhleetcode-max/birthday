<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Security (see docs/SECURITY.md): only this site's own code runs; the GitHub token can only
       travel to api.github.com; photos/media may come from this site, blob:/data: (drafts) and
       raw.githubusercontent.com (fallback for files not on the site yet). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://raw.githubusercontent.com; media-src 'self' blob: data: https://raw.githubusercontent.com; font-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0614">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>The Lantern Room</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23160b26'/%3E%3Cpath d='M24 14h16M27 14v4M37 14v4' stroke='%23f4c463' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M19 25c0-4 5-7 13-7s13 3 13 7v17c0 4-5 7-13 7s-13-3-13-7z' fill='%23ffb347'/%3E%3Cpath d='M32 26c-3 3.5-4 6-2 8.5 1.4 1.6 4.4 1.3 5-1 .6-2.4-1-4.6-3-7.5z' fill='%23fff4e0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#library" aria-label="The Lantern Room — photo library">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v2M14 3v2"/><path d="M7 7.5C7 6 8.5 5 12 5s5 1 5 2.5v8c0 1.5-1.5 2.5-5 2.5s-5-1-5-2.5z"/><path d="M10 18v2h4v-2"/><path d="M12 9.5c-1 1.2-1.4 2.2-.6 3.2.5.6 1.7.5 1.9-.4.2-.9-.4-1.8-1.3-2.8z" fill="currentColor"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">The Lantern Room</span>
          <span class="brand-sub">for Deepu’s film</span>
        </span>
      </a>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <p class="sidebar-foot">Nothing here is public until you press Publish.</p>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="topbar-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v2M14 3v2"/><path d="M7 7.5C7 6 8.5 5 12 5s5 1 5 2.5v8c0 1.5-1.5 2.5-5 2.5s-5-1-5-2.5z"/><path d="M10 18v2h4v-2"/><path d="M12 9.5c-1 1.2-1.4 2.2-.6 3.2.5.6 1.7.5 1.9-.4.2-.9-.4-1.8-1.3-2.8z" fill="currentColor"/></svg>
        </span>
        <h1 id="topbar-title" class="topbar-title">The Lantern Room</h1>
        <button id="status" class="status" type="button" data-conn="none" data-draft="no" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text"><span class="status-main">Loading…</span><span class="status-sub"></span></span>
          <span class="status-short" aria-hidden="true">…</span>
        </button>
        <div class="top-actions" role="toolbar" aria-label="Draft actions">
          <button class="btn ghost act-save" type="button" data-action="save" aria-label="Save draft" title="Save draft (Ctrl/⌘ S)">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg></span><span class="act-label">Save draft</span>
          </button>
          <button class="btn ghost act-preview" type="button" data-action="preview" aria-label="Preview the film with your draft" title="Preview (opens a new tab)">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="act-label">Preview</span>
          </button>
          <button class="btn gold act-publish" type="button" data-action="publish" data-testid="publish">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4l-4 16-4-7-8-1z"/><path d="m12 13 8-9"/></svg></span><span>Publish</span><span class="badge-count" hidden>0</span>
          </button>
          <button class="icon-btn act-more" type="button" data-action="more" aria-haspopup="menu" aria-expanded="false" aria-label="More actions: export, reset" data-testid="more">
            <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg></span>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
      <footer class="page-foot">Made with love for Deepu · nothing here is public until you publish</footer>
    </div>
  </div>

  <nav id="bottomnav" class="bottomnav" aria-label="Sections"></nav>

  <div id="busy" class="busy" hidden role="status" aria-live="assertive">
    <div class="busy-card"><span class="spinner" aria-hidden="true"></span><p id="busy-label">Working…</p></div>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-relevant="additions"></div>

  <noscript><p class="noscript">The Lantern Room needs JavaScript.</p></noscript>
  <script type="module" src="admin.js"></script>
</body>
</html>
